<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/an round tree with open to up and close in bottom-48x48.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>WebTree | High-Quality Frontend Resources & UI Tools</title>
    <meta
      name="title"
      content="WebTree | High-Quality Frontend Resources & UI Tools"
    />
    <meta
      name="description"
      content="A curated directory of the best frontend development resources. Discover UI kits, high-quality fonts, animations, icons, and design inspiration in one place."
    />
    <meta
      name="keywords"
      content="frontend resources,webtree, frontend, resources, collection,  ui kits, react components, framer motion, fonts, icons, web design inspiration, developer tools"
    />
    <meta name="author" content="Shani Tiwari" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://webtree.vercel.app/" />
    <meta
      property="og:title"
      content="WebTree | High-Quality Frontend Resources & UI Tools"
    />
    <meta
      property="og:description"
      content="A curated directory of the best frontend development resources. Discover UI kits, fonts, and tools to speed up your workflow."
    />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://webtree.vercel.app/" />
    <meta
      property="twitter:title"
      content="WebTree | High-Quality Frontend Resources & UI Tools"
    />
    <meta
      property="twitter:description"
      content="A curated directory of the best frontend development resources. Discover UI kits, fonts, and tools to speed up your workflow."
    />
    <meta property="twitter:image" content="/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "WebTree",
        "url": "https://webtree.vercel.app/",
        "description": "Curated frontend development resources directory.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://webtree.vercel.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
